<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción al Torneo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8 flex items-center justify-center">

  <div class="max-w-md w-full bg-gray-800 p-6 md:p-8 rounded-xl border border-gray-700 shadow-2xl">
    <h1 class="text-2xl font-extrabold text-center text-indigo-400 mb-2">🎮 Inscripción al Torneo</h1>
    <p class="text-xs text-gray-400 text-center mb-6">Completa tus datos para registrarte en el torneo.</p>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-300 mb-1">Nombre de Twitch</label>
        <input type="text" id="twitch-user" placeholder="Ej: tu_usuario" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-300 mb-1">ID del Juego</label>
        <input type="text" id="game-id" placeholder="Ej: Player#1234" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-300 mb-1">Plataforma</label>
        <select id="platform" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
          <option value="" disabled selected>Selecciona tu plataforma</option>
          <option value="PC">PC</option>
          <option value="PS5">PlayStation 5</option>
          <option value="PS4">PlayStation 4</option>
          <option value="Xbox Series">Xbox Series X/S</option>
          <option value="Xbox One">Xbox One</option>
          <option value="Nintendo Switch">Nintendo Switch</option>
        </select>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-lg font-bold transition mt-2">
        Anotarse al Torneo
      </button>
    </form>

    <div id="status-message" class="hidden mt-4 p-3 rounded-lg text-center text-sm font-bold"></div>

    <div class="mt-6 text-center border-t border-gray-700 pt-4">
      <a href="index.html" class="text-xs text-indigo-400 hover:underline">← Ver Lista de Participantes</a>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const registerForm = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Registrando...";

      const twitch = document.getElementById('twitch-user').value.trim();
      const gameId = document.getElementById('game-id').value.trim();
      const platform = document.getElementById('platform').value;

      try {
        await addDoc(collection(db, "equipos"), {
          twitch: twitch,
          gameId: gameId,
          plataforma: platform,
          tiempo: "", // Inicialmente vacío
          registradoEn: serverTimestamp()
        });

        statusMessage.className = "mt-4 p-3 rounded-lg text-center text-sm font-bold bg-green-500/20 text-green-400 border border-green-500/30";
        statusMessage.textContent = "¡Te has inscripto con éxito! 🎉";
        statusMessage.classList.remove('hidden');

        registerForm.reset();
      } catch (error) {
        console.error("Error al registrar: ", error);
        statusMessage.className = "mt-4 p-3 rounded-lg text-center text-sm font-bold bg-red-500/20 text-red-400 border border-red-500/30";
        statusMessage.textContent = "Hubo un error al guardar tu inscripción. Inténtalo de nuevo.";
        statusMessage.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Anotarse al Torneo";
      }
    });
  </script>
</body>
</html>
