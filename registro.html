<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción - Torneo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-md mx-auto mt-8">
    <!-- Encabezado -->
    <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
      <h1 class="text-2xl font-extrabold text-indigo-400">🎮 Inscripción al Torneo</h1>
      <a href="index.html" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-lg border border-gray-700 transition">🏆 Ver Tabla</a>
    </header>

    <!-- Formulario de Registro -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-2xl">
      <form id="registro-form" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1 font-semibold">Nombre / Nick *</label>
          <input type="text" id="nombre" required placeholder="Tu nombre o Nick" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 font-semibold">Canal de Twitch (opcional)</label>
          <input type="text" id="twitch" placeholder="ej. tu_usuario" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 font-semibold">ID de Juego *</label>
          <input type="text" id="gameId" required placeholder="Tu ID / GamerTag" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 font-semibold">Plataforma *</label>
          <select id="plataforma" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
            <option value="">-- Selecciona plataforma --</option>
            <option value="PC">PC</option>
            <option value="PS5">PS5</option>
            <option value="PS4">PS4</option>
            <option value="Xbox">Xbox</option>
            <option value="Switch">Switch</option>
          </select>
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-lg font-bold transition shadow-lg mt-6">
          Registrarme
        </button>
      </form>

      <div id="mensaje" class="hidden mt-4 p-3 rounded-lg text-center font-bold text-sm"></div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const registroForm = document.getElementById('registro-form');
    const mensaje = document.getElementById('mensaje');
    const btnSubmit = document.getElementById('btn-submit');

    registroForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Registrando...';

      const nombre = document.getElementById('nombre').value.trim();
      const twitch = document.getElementById('twitch').value.trim();
      const gameId = document.getElementById('gameId').value.trim();
      const plataforma = document.getElementById('plataforma').value;

      try {
        await addDoc(collection(db, "equipos"), {
          nombre: nombre,
          twitch: twitch,
          gameId: gameId,
          plataforma: plataforma,
          tiempo: "" // Se inicializa vacío para ser asignado en el panel de admin
        });

        mensaje.className = 'mt-4 p-3 rounded-lg text-center font-bold text-sm bg-green-900/60 text-green-300 border border-green-700';
        mensaje.textContent = '¡Inscripción realizada con éxito! Redirigiendo a la tabla...';
        mensaje.classList.remove('hidden');

        registroForm.reset();

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);

      } catch (error) {
        console.error("Error al registrar: ", error);
        mensaje.className = 'mt-4 p-3 rounded-lg text-center font-bold text-sm bg-red-900/60 text-red-300 border border-red-700';
        mensaje.textContent = 'Ocurrió un error al guardar los datos. Intenta nuevamente.';
        mensaje.classList.remove('hidden');

        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Registrarme';
      }
    });
  </script>
</body>
</html>
