<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Participantes - Torneo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Encabezado -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 border-b border-gray-700 pb-4">
      <h1 class="text-2xl md:text-4xl font-extrabold text-indigo-400">🏆 Participantes inscriptos</h1>
      <div class="flex gap-2">
        <a href="registro.html" class="text-xs md:text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded-lg transition">¡Inscribirme!</a>
        <a href="admin.html" class="text-xs md:text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-lg border border-gray-700 transition">Panel Admin</a>
      </div>
    </header>

    <!-- Tabla -->
    <div class="bg-gray-800 shadow-2xl rounded-xl overflow-hidden border border-gray-700">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-700/50 text-gray-300 text-xs md:text-sm uppercase tracking-wider">
              <th class="p-4 w-12 text-center">#</th>
              <th class="p-4">Twitch</th>
              <th class="p-4">ID Juego</th>
              <th class="p-4 text-center font-bold text-indigo-400">Tiempo</th>
              <th class="p-4 text-center">Plataforma</th>
            </tr>
          </thead>
          <tbody id="tabla-body" class="divide-y divide-gray-700/60 text-sm md:text-base">
            <tr>
              <td colspan="5" class="p-6 text-center text-gray-400">Cargando datos del torneo...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const tbody = document.getElementById('tabla-body');

    onSnapshot(collection(db, "equipos"), (snapshot) => {
      tbody.innerHTML = '';
      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">No hay inscriptos aún.</td></tr>`;
        return;
      }

      let posicion = 1;
      snapshot.forEach((doc) => {
        const jugador = doc.data();
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-750/50 transition-colors';
        
        row.innerHTML = `
          <td class="p-4 text-center font-bold text-gray-400">${posicion}</td>
          <td class="p-4 font-semibold text-indigo-300">
            ${jugador.twitch ? `<a href="https://twitch.tv/${jugador.twitch}" target="_blank" class="hover:underline">@${jugador.twitch}</a>` : '-'}
          </td>
          <td class="p-4 font-semibold text-white">${jugador.gameId || jugador.nombre || '-'}</td>
          <td class="p-4 text-center font-extrabold text-indigo-400 text-lg">${jugador.tiempo || '--:--.---'}</td>
          <td class="p-4 text-center text-gray-300">${jugador.plataforma || '-'}</td>
        `;
        tbody.appendChild(row);
        posicion++;
      });
    });
  </script>
</body>
</html>
